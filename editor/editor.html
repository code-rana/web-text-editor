
<!DOCTYPE html>
<html>
<head>
<title>Web Text Editor</title>
<link rel="stylesheet" type="text/css" href="css/pad.css">  <!-- import style css to this page -->
<script src="scripts/jquery.js"></script>				<!-- import the library jQuery visit jQuery.com for any documenttation related to it-->
<script src="scripts/pad.js"></script>					<!-- import pad.js for text based operations-->
</head>
<script>
$(document).ready(function() {
$('#colorplate').hide();
$('#pad').on('scroll', function () {		// set action .on with #pad so that on scrolling both numbers and text scroll together
    $('#padnumbers').scrollTop($('#pad').scrollTop());		// scroll #padnumbers if #pad is scrolled
});

$('#colorchange').click(function() {                // when click on button A show color plate
$('#colorplate').show();

});

$('#quit').click(function() {  				// close colorplate when Quit is selected
$('#colorplate').hide();
});

$('#ok').click(function() {					// close colorplate after a color has been selected
$('#colorplate').hide();
});

});

// Enhanced functionality - hide all modals on start
$(document).ready(function() {
    $('#bgcolorplate, #find-replace-modal').hide();

    // Background color functionality
    $('#bg-color').click(function() {
        $('#bgcolorplate').show();
    });

    // Find & Replace functionality
    $('#find-replace').click(function() {
        $('#find-replace-modal').show();
        $('#find-input').focus();
    });

    // Modal close handlers
    $('.close-modal, .modal-btn.secondary').click(function() {
        $('.modal').hide();
    });

    $('#color-ok, #color-cancel, #close-color').click(function() {
        $('#colorplate').hide();
    });

    $('#bg-color-ok, #bg-color-cancel, #close-bg-color').click(function() {
        $('#bgcolorplate').hide();
    });

    // File operations
    $('#new-doc').click(function() {
        if (confirm('Are you sure you want to create a new document? Any unsaved changes will be lost.')) {
            $('#pad').val('');
            if (typeof resetLineNumbers === 'function') resetLineNumbers();
            if (typeof updateWordCount === 'function') updateWordCount();
        }
    });

    $('#open-file').click(function() {
        $('#file-input').click();
    });

    $('#save-file').click(function() {
        if (typeof saveFile === 'function') saveFile();
    });

    // Undo/Redo handlers
    $('#undo').click(function() {
        if (typeof undo === 'function') undo();
    });

    $('#redo').click(function() {
        if (typeof redo === 'function') redo();
    });

    // File input handler
    $('#file-input').change(function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                $('#pad').val(e.target.result);
                if (typeof resetLineNumbers === 'function') resetLineNumbers();
                if (typeof updateWordCount === 'function') updateWordCount();
                if (typeof recalculateLineNumbers === 'function') recalculateLineNumbers();
            };
            reader.readAsText(file);
        }
    });

    // Safe event handling for pad textarea
    $('#pad').on('keydown', function(event) {
        try {
            line(event);
        } catch (error) {
            console.error('Error in line function:', error);
        }
    });

    // Prevent infinite focus loops
    let focusLockout = false;
    $('#pad').on('blur', function() {
        if (!focusLockout) {
            focusLockout = true;
            setTimeout(() => {
                if (document.activeElement !== this) {
                    this.focus();
                }
                focusLockout = false;
            }, 50);
        }
    });

    // Initialize word count on page load
    if (typeof updateWordCount === 'function') {
        updateWordCount();
    }

    // Safe initial focus
    setTimeout(function() {
        document.getElementById('pad').focus();
    }, 100);
});

/* helping script */
$("textarea").keydown(function(e) {
    if(e.keyCode === 9) { // tab was pressed
        // get caret position/selection
        var start = this.selectionStart;
        var end = this.selectionEnd;

        var $this = $(this);
        var value = $this.val();

        // set textarea value to: text before caret + tab + text after caret
        $this.val(value.substring(0, start)
                    + "\t"
                    + value.substring(end));

        // put caret at right position again (add one for the tab)
        this.selectionStart = this.selectionEnd = start + 1;

        // prevent the focus lose
        e.preventDefault();
    }
});


</script>





<body>
<!-- Hidden file input for open functionality -->
<input type="file" id="file-input" accept=".txt,.text,text/*" style="display: none;">

<div id="importpad">             <!-- parent division -->
	<div id="editorarea">		<!-- editor div -->
		<div id="padmenu">		<!-- menu div -->
			<div class="toolbar-section">
				<!-- File Operations -->
				<div class="toolbar-group">
					<button class="toolbar-btn" id="new-doc" title="New Document (Ctrl+N)">📄</button>
					<button class="toolbar-btn" id="open-file" title="Open File (Ctrl+O)">📁</button>
					<button class="toolbar-btn" id="save-file" title="Save File (Ctrl+S)">💾</button>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Edit Operations -->
				<div class="toolbar-group">
					<button class="toolbar-btn" id="undo" title="Undo (Ctrl+Z)">↶</button>
					<button class="toolbar-btn" id="redo" title="Redo (Ctrl+Y)">↷</button>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Text Formatting -->
				<div class="toolbar-group">
					<button class="toolbar-btn format-btn" id="bold-btn" onClick="toggleBold()" title="Bold (Ctrl+B)"><strong>B</strong></button>
					<button class="toolbar-btn format-btn" id="italic-btn" onClick="toggleItalic()" title="Italic (Ctrl+I)"><em>I</em></button>
					<button class="toolbar-btn format-btn" id="underline-btn" onClick="toggleUnderline()" title="Underline (Ctrl+U)"><u>U</u></button>
					<button class="toolbar-btn format-btn" id="strike-btn" onClick="toggleStrike()" title="Strikethrough"><s>S</s></button>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Alignment -->
				<div class="toolbar-group">
					<button class="toolbar-btn" onClick="alignText('left')" title="Align Left">⬅</button>
					<button class="toolbar-btn" onClick="alignText('center')" title="Align Center">↔</button>
					<button class="toolbar-btn" onClick="alignText('right')" title="Align Right">➡</button>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Font Controls -->
				<div class="toolbar-group">
					<select name="fontfamily" id="fontfamily" onChange="fontChange()" class="toolbar-select" title="Font Family">
						<option value="Arial, sans-serif">Arial</option>
						<option value="'Times New Roman', serif">Times New Roman</option>
						<option value="'Courier New', monospace">Courier New</option>
						<option value="Helvetica, sans-serif">Helvetica</option>
						<option value="'Lucida Console', monospace">Lucida Console</option>
						<option value="Georgia, serif">Georgia</option>
						<option value="Verdana, sans-serif">Verdana</option>
						<option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
					</select>
					
					<select name="fontsize" id="fontsize" onChange="fontSize()" class="toolbar-select" title="Font Size">
						<option value="8px">8px</option>
						<option value="9px">9px</option>
						<option value="10px">10px</option>
						<option value="11px">11px</option>
						<option value="12px">12px</option>
						<option value="13px">13px</option>
						<option value="14px" selected>14px</option>
						<option value="15px">15px</option>
						<option value="16px">16px</option>
						<option value="18px">18px</option>
						<option value="20px">20px</option>
						<option value="22px">22px</option>
						<option value="24px">24px</option>
						<option value="28px">28px</option>
						<option value="32px">32px</option>
						<option value="36px">36px</option>
					</select>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Color and Background -->
				<div class="toolbar-group">
					<button class="toolbar-btn" id="colorchange" title="Text Color">🎨</button>
					<button class="toolbar-btn" id="bg-color" title="Background Color">🖍</button>
				</div>
				
				<div class="toolbar-separator"></div>
				
				<!-- Search and Replace -->
				<div class="toolbar-group">
					<button class="toolbar-btn" id="find-replace" title="Find & Replace (Ctrl+F)">🔍</button>
				</div>
			</div>
		</div>
		<div class="textarea-container">
			<div class="line-numbers-container">
				<textarea name="padnumbers" id="padnumbers" disabled readonly>0</textarea>  <!-- numbers are shown as new line begins -->
			</div>
			<div class="editor-container">
				<textarea id="pad" name="pad" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
				<!-- the above textarea where text-edit will be done -->
			</div>
		</div>
		<!--Division Area where total words and characters calculated are shown -->
		<div id="bottom" style="background:#f0f0f0;"> Total Words : <input type="text" id="words" name="words" disabled>
		Total Characters : <input type="text" id="chars" name="chars" disabled></div>
	</div>
	
	
	
</div>

<!-- Enhanced Color Picker Modal -->
<div id="colorplate" class="modal">
	<div class="modal-content">
		<div class="modal-header">
			<h3>Choose Text Color</h3>
			<span class="close-modal" id="close-color">&times;</span>
		</div>
		<div class="color-grid">
			<div class="color-row">
				<button class="color-btn" style="background:#000000;" onClick="setTextColor('#000000')" title="Black"></button>
				<button class="color-btn" style="background:#7F7F7F;" onClick="setTextColor('#7F7F7F')" title="Gray"></button>
				<button class="color-btn" style="background:#880015;" onClick="setTextColor('#880015')" title="Dark Red"></button>
				<button class="color-btn" style="background:#ED1C24;" onClick="setTextColor('#ED1C24')" title="Red"></button>
				<button class="color-btn" style="background:#FFF200;" onClick="setTextColor('#FFF200')" title="Yellow"></button>
				<button class="color-btn" style="background:#22B14C;" onClick="setTextColor('#22B14C')" title="Green"></button>
				<button class="color-btn" style="background:#00A2E8;" onClick="setTextColor('#00A2E8')" title="Blue"></button>
				<button class="color-btn" style="background:#3F48CC;" onClick="setTextColor('#3F48CC')" title="Dark Blue"></button>
			</div>
			<div class="color-row">
				<button class="color-btn" style="background:#A349A4;" onClick="setTextColor('#A349A4')" title="Purple"></button>
				<button class="color-btn" style="background:#B97A57;" onClick="setTextColor('#B97A57')" title="Brown"></button>
				<button class="color-btn" style="background:#FFAEC9;" onClick="setTextColor('#FFAEC9')" title="Pink"></button>
				<button class="color-btn" style="background:#FFC90E;" onClick="setTextColor('#FFC90E')" title="Orange"></button>
				<button class="color-btn" style="background:#B5E61D;" onClick="setTextColor('#B5E61D')" title="Lime"></button>
				<button class="color-btn" style="background:#99D9EA;" onClick="setTextColor('#99D9EA')" title="Light Blue"></button>
				<button class="color-btn" style="background:#7092BE;" onClick="setTextColor('#7092BE')" title="Steel Blue"></button>
				<button class="color-btn" style="background:#FFFFFF; border: 1px solid #ccc;" onClick="setTextColor('#FFFFFF')" title="White"></button>
			</div>
			<div class="color-row">
				<button class="color-btn" style="background:#FF6B6B;" onClick="setTextColor('#FF6B6B')" title="Light Red"></button>
				<button class="color-btn" style="background:#4ECDC4;" onClick="setTextColor('#4ECDC4')" title="Teal"></button>
				<button class="color-btn" style="background:#45B7D1;" onClick="setTextColor('#45B7D1')" title="Sky Blue"></button>
				<button class="color-btn" style="background:#96CEB4;" onClick="setTextColor('#96CEB4')" title="Mint"></button>
				<button class="color-btn" style="background:#FFEAA7;" onClick="setTextColor('#FFEAA7')" title="Light Yellow"></button>
				<button class="color-btn" style="background:#DDA0DD;" onClick="setTextColor('#DDA0DD')" title="Plum"></button>
				<button class="color-btn" style="background:#98D8C8;" onClick="setTextColor('#98D8C8')" title="Light Green"></button>
				<button class="color-btn" style="background:#F7DC6F;" onClick="setTextColor('#F7DC6F')" title="Gold"></button>
			</div>
		</div>
		<div class="custom-color">
			<label for="custom-color-input">Custom Color: </label>
			<input type="color" id="custom-color-input" onchange="setTextColor(this.value)">
		</div>
		<div class="modal-footer">
			<button class="modal-btn primary" id="color-ok">Apply</button>
			<button class="modal-btn secondary" id="color-cancel">Cancel</button>
		</div>
	</div>
</div>

<!-- Background Color Picker Modal -->
<div id="bgcolorplate" class="modal">
	<div class="modal-content">
		<div class="modal-header">
			<h3>Choose Background Color</h3>
			<span class="close-modal" id="close-bg-color">&times;</span>
		</div>
		<div class="color-grid">
			<div class="color-row">
				<button class="color-btn" style="background:#FFFFFF; border: 1px solid #ccc;" onClick="setBgColor('#FFFFFF')" title="White"></button>
				<button class="color-btn" style="background:#F8F9FA;" onClick="setBgColor('#F8F9FA')" title="Light Gray"></button>
				<button class="color-btn" style="background:#E9ECEF;" onClick="setBgColor('#E9ECEF')" title="Gray"></button>
				<button class="color-btn" style="background:#DEE2E6;" onClick="setBgColor('#DEE2E6')" title="Medium Gray"></button>
				<button class="color-btn" style="background:#000000;" onClick="setBgColor('#000000')" title="Black"></button>
				<button class="color-btn" style="background:#FFF3CD;" onClick="setBgColor('#FFF3CD')" title="Light Yellow"></button>
				<button class="color-btn" style="background:#D4EDDA;" onClick="setBgColor('#D4EDDA')" title="Light Green"></button>
				<button class="color-btn" style="background:#CCE5FF;" onClick="setBgColor('#CCE5FF')" title="Light Blue"></button>
			</div>
		</div>
		<div class="custom-color">
			<label for="custom-bg-color-input">Custom Background: </label>
			<input type="color" id="custom-bg-color-input" onchange="setBgColor(this.value)">
		</div>
		<div class="modal-footer">
			<button class="modal-btn primary" id="bg-color-ok">Apply</button>
			<button class="modal-btn secondary" id="bg-color-cancel">Cancel</button>
		</div>
	</div>
</div>

<!-- Find & Replace Modal -->
<div id="find-replace-modal" class="modal">
	<div class="modal-content">
		<div class="modal-header">
			<h3>Find & Replace</h3>
			<span class="close-modal" id="close-find-replace">&times;</span>
		</div>
		<div class="find-replace-content">
			<div class="input-group">
				<label for="find-input">Find:</label>
				<input type="text" id="find-input" placeholder="Enter text to find...">
				<button class="find-btn" id="find-next">Find Next</button>
				<button class="find-btn" id="find-prev">Find Previous</button>
			</div>
			<div class="input-group">
				<label for="replace-input">Replace:</label>
				<input type="text" id="replace-input" placeholder="Enter replacement text...">
				<button class="find-btn" id="replace-one">Replace</button>
				<button class="find-btn" id="replace-all">Replace All</button>
			</div>
			<div class="find-options">
				<label><input type="checkbox" id="match-case"> Match Case</label>
				<label><input type="checkbox" id="whole-word"> Whole Word</label>
			</div>
			<div id="find-results" class="find-results"></div>
		</div>
	</div>
</div>

<!-- File Input for Opening Files -->
<input type="file" id="file-input" accept=".txt,.md,.js,.html,.css,.json" style="display: none;">

</body>
</html>
